<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/templates/main.xhtml">
    <ui:define name="title">Créer un courriel</ui:define>
    <ui:define name="content">
<h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h1>Créer un courriel</h1>
            <h:form styleClass="crud-page">
                <h:inputHidden id="validateCreateField" validator="#{emailOutbox.validateCreate}" value="value"/>
                <h:panelGrid columns="2">
                    <h:outputText value="Clé d’événement:"/>
                    <h:inputText id="eventKey" value="#{emailOutbox.emailOutbox.eventKey}" title="Clé d’événement" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Destinataire:"/>
                    <h:inputText id="recipient" value="#{emailOutbox.emailOutbox.recipient}" title="Destinataire" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Objet:"/>
                    <h:inputText id="subject" value="#{emailOutbox.emailOutbox.subject}" title="Objet" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Contenu:"/>
                    <h:inputText id="body" value="#{emailOutbox.emailOutbox.body}" title="Contenu" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Statut:"/>
                    <h:inputText id="status" value="#{emailOutbox.emailOutbox.status}" title="Statut" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Nombre de tentatives:"/>
                    <h:inputText id="attemptCount" value="#{emailOutbox.emailOutbox.attemptCount}" title="Nombre de tentatives" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Prochaine tentative (jj/mm/aaaa hh:mm):"/>
                    <h:inputText id="nextAttemptAt" value="#{emailOutbox.emailOutbox.nextAttemptAt}" title="Prochaine tentative" required="true" requiredMessage="Ce champ est obligatoire." >
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:inputText>
                    <h:outputText value="Réservé le (jj/mm/aaaa hh:mm):"/>
                    <h:inputText id="claimedAt" value="#{emailOutbox.emailOutbox.claimedAt}" title="Réservé le" >
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:inputText>
                    <h:outputText value="Créé le (jj/mm/aaaa hh:mm):"/>
                    <h:inputText id="createdAt" value="#{emailOutbox.emailOutbox.createdAt}" title="Créé le" required="true" requiredMessage="Ce champ est obligatoire." >
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:inputText>
                    <h:outputText value="Envoyé le (jj/mm/aaaa hh:mm):"/>
                    <h:inputText id="sentAt" value="#{emailOutbox.emailOutbox.sentAt}" title="Envoyé le" >
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:inputText>
                    <h:outputText value="Dernière erreur:"/>
                    <h:inputText id="lastError" value="#{emailOutbox.emailOutbox.lastError}" title="Dernière erreur" />

                </h:panelGrid>
                <br />
                <h:commandLink action="#{emailOutbox.create}" value="Créer"/>
                <br />
                <br />
                <h:commandLink action="#{emailOutbox.listSetup}" value="Retour à la liste" immediate="true"/>
                <br />
                <br />
                <h:commandLink value="Tableau de bord" action="welcome" immediate="true" />

            </h:form>
    </ui:define>
</ui:composition>
