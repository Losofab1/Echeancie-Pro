<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/templates/main.xhtml">
    <ui:define name="title">File des courriels</ui:define>
    <ui:define name="content">
<h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h1>File des courriels</h1>
            <h:form styleClass="jsfcrud_list_form">
                <h:outputText escape="false" value="Aucun élément à afficher&lt;br /&gt;" rendered="#{emailOutbox.pagingInfo.itemCount == 0}" />
                <h:panelGroup rendered="#{emailOutbox.pagingInfo.itemCount > 0}">
                    <h:outputText value="Éléments #{emailOutbox.pagingInfo.firstItem + 1} à #{emailOutbox.pagingInfo.lastItem} sur #{emailOutbox.pagingInfo.itemCount}"/>&#160;
                    <h:commandLink action="#{emailOutbox.prev}" value="Précédent #{emailOutbox.pagingInfo.batchSize}" rendered="#{emailOutbox.pagingInfo.firstItem >= emailOutbox.pagingInfo.batchSize}"/>&#160;
                    <h:commandLink action="#{emailOutbox.next}" value="Suivant #{emailOutbox.pagingInfo.batchSize}" rendered="#{emailOutbox.pagingInfo.lastItem + emailOutbox.pagingInfo.batchSize &lt;= emailOutbox.pagingInfo.itemCount}"/>&#160;
                    <h:commandLink action="#{emailOutbox.next}" value="Restant #{emailOutbox.pagingInfo.itemCount - emailOutbox.pagingInfo.lastItem}"
                                   rendered="#{emailOutbox.pagingInfo.lastItem &lt; emailOutbox.pagingInfo.itemCount &amp;&amp; emailOutbox.pagingInfo.lastItem + emailOutbox.pagingInfo.batchSize > emailOutbox.pagingInfo.itemCount}"/>
                    <div class="table-responsive crud-table-wrap"><h:dataTable value="#{emailOutbox.emailOutboxItems}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px" styleClass="table crud-table align-middle">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Identifiant"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Clé d’événement"/>
                            </f:facet>
                            <h:outputText value="#{item.eventKey}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Destinataire"/>
                            </f:facet>
                            <h:outputText value="#{item.recipient}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Objet"/>
                            </f:facet>
                            <h:outputText value="#{item.subject}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Contenu"/>
                            </f:facet>
                            <h:outputText value="#{item.body}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Statut"/>
                            </f:facet>
                            <h:outputText value="#{item.status}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Nombre de tentatives"/>
                            </f:facet>
                            <h:outputText value="#{item.attemptCount}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Prochaine tentative"/>
                            </f:facet>
                            <h:outputText value="#{item.nextAttemptAt}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Réservé le"/>
                            </f:facet>
                            <h:outputText value="#{item.claimedAt}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Créé le"/>
                            </f:facet>
                            <h:outputText value="#{item.createdAt}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Envoyé le"/>
                            </f:facet>
                            <h:outputText value="#{item.sentAt}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Dernière erreur"/>
                            </f:facet>
                            <h:outputText value="#{item.lastError}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText escape="false" value="&#160;"/>
                            </f:facet>
                            <h:commandLink value="Consulter" action="#{emailOutbox.detailSetup}">
                                <f:param name="jsfcrud.currentEmailOutbox" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][item][emailOutbox.converter].jsfcrud_invoke}"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Modifier" action="#{emailOutbox.editSetup}">
                                <f:param name="jsfcrud.currentEmailOutbox" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][item][emailOutbox.converter].jsfcrud_invoke}"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Supprimer" action="#{emailOutbox.destroy}">
                                <f:param name="jsfcrud.currentEmailOutbox" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][item][emailOutbox.converter].jsfcrud_invoke}"/>
                            </h:commandLink>
                        </h:column>

                    </h:dataTable></div>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{emailOutbox.createSetup}" value="Créer un courriel"/>
                <br />
                <br />
                <h:commandLink value="Tableau de bord" action="welcome" immediate="true" />


            </h:form>
    </ui:define>
</ui:composition>
