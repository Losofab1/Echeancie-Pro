<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/templates/main.xhtml">
    <ui:define name="title">Détail de l’échéance demandée</ui:define>
    <ui:define name="content">
<h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h1>Détail de l’échéance demandée</h1>
            <h:form styleClass="crud-page">
                <h:panelGrid columns="2">
                    <h:outputText value="Identifiant:"/>
                    <h:outputText value="#{paymentRequestInstallments.paymentRequestInstallments.id}" title="Identifiant" />
                    <h:outputText value="Numéro d’échéance:"/>
                    <h:outputText value="#{paymentRequestInstallments.paymentRequestInstallments.installmentNumber}" title="Numéro d’échéance" />
                    <h:outputText value="Date d’échéance:"/>
                    <h:outputText value="#{paymentRequestInstallments.paymentRequestInstallments.dueDate}" title="Date d’échéance" >
                        <f:convertDateTime pattern="dd/MM/yyyy" />
                    </h:outputText>
                    <h:outputText value="Client:"/>
                    <h:outputText value="#{paymentRequestInstallments.paymentRequestInstallments.requestId.clientId.name}" title="Client"/>
                    <h:outputText value="Demande:"/>
                    <h:panelGroup>
                        <h:outputText value="Demande du #{paymentRequestInstallments.paymentRequestInstallments.requestId.createdAt}">
                            <f:convertDateTime pattern="dd/MM/yyyy"/>
                        </h:outputText>
                        <h:panelGroup rendered="#{paymentRequestInstallments.paymentRequestInstallments.requestId != null}">
                            <h:outputText value=" ("/>
                            <h:commandLink value="Consulter" action="#{paymentRequests.detailSetup}">
                                <f:param name="jsfcrud.currentPaymentRequestInstallments" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][paymentRequestInstallments.paymentRequestInstallments][paymentRequestInstallments.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.currentPaymentRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][paymentRequestInstallments.paymentRequestInstallments.requestId][paymentRequests.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.relatedController" value="paymentRequestInstallments"/>
                                <f:param name="jsfcrud.relatedControllerType" value="com.mycompany.jsf.PaymentRequestInstallmentsController"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Modifier" action="#{paymentRequests.editSetup}">
                                <f:param name="jsfcrud.currentPaymentRequestInstallments" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][paymentRequestInstallments.paymentRequestInstallments][paymentRequestInstallments.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.currentPaymentRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][paymentRequestInstallments.paymentRequestInstallments.requestId][paymentRequests.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.relatedController" value="paymentRequestInstallments"/>
                                <f:param name="jsfcrud.relatedControllerType" value="com.mycompany.jsf.PaymentRequestInstallmentsController"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Supprimer" action="#{paymentRequests.destroy}">
                                <f:param name="jsfcrud.currentPaymentRequestInstallments" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][paymentRequestInstallments.paymentRequestInstallments][paymentRequestInstallments.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.currentPaymentRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][paymentRequestInstallments.paymentRequestInstallments.requestId][paymentRequests.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.relatedController" value="paymentRequestInstallments"/>
                                <f:param name="jsfcrud.relatedControllerType" value="com.mycompany.jsf.PaymentRequestInstallmentsController"/>
                            </h:commandLink>
                            <h:outputText value=" )"/>
                        </h:panelGroup>
                    </h:panelGroup>


                </h:panelGrid>
                <br />
                <h:commandLink action="#{paymentRequestInstallments.destroy}" value="Supprimer">
                    <f:param name="jsfcrud.currentPaymentRequestInstallments" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][paymentRequestInstallments.paymentRequestInstallments][paymentRequestInstallments.converter].jsfcrud_invoke}" />
                </h:commandLink>
                <br />
                <br />
                <h:commandLink action="#{paymentRequestInstallments.editSetup}" value="Modifier">
                    <f:param name="jsfcrud.currentPaymentRequestInstallments" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][paymentRequestInstallments.paymentRequestInstallments][paymentRequestInstallments.converter].jsfcrud_invoke}" />
                </h:commandLink>
                <br />
                <h:commandLink action="#{paymentRequestInstallments.createSetup}" value="Créer une échéance demandée" />
                <br />
                <h:commandLink action="#{paymentRequestInstallments.listSetup}" value="Retour à la liste"/>
                <br />
                <br />
                <h:commandLink value="Tableau de bord" action="welcome" immediate="true" />

            </h:form>
    </ui:define>
</ui:composition>
