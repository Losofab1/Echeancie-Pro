<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/templates/main.xhtml">
    <ui:define name="title">Détail de la demande de client</ui:define>
    <ui:define name="content">
<h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h1>Détail de la demande de client</h1>
            <h:form styleClass="crud-page">
                <h:panelGrid columns="2">
                    <h:outputText value="Identifiant:"/>
                    <h:outputText value="#{clientCreationRequests.clientCreationRequests.id}" title="Identifiant" />
                    <h:outputText value="Nom:"/>
                    <h:outputText value="#{clientCreationRequests.clientCreationRequests.name}" title="Nom" />
                    <h:outputText value="Courriel:"/>
                    <h:outputText value="#{clientCreationRequests.clientCreationRequests.email}" title="Courriel" />
                    <h:outputText value="Téléphone:"/>
                    <h:outputText value="#{clientCreationRequests.clientCreationRequests.phone}" title="Téléphone" />
                    <h:outputText value="Statut:"/>
                    <h:outputText value="#{clientCreationRequests.clientCreationRequests.status}" title="Statut" />
                    <h:outputText value="Créé le:"/>
                    <h:outputText value="#{clientCreationRequests.clientCreationRequests.createdAt}" title="Créé le" >
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                    <h:outputText value="Traité le:"/>
                    <h:outputText value="#{clientCreationRequests.clientCreationRequests.reviewedAt}" title="Traité le" >
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                    <h:outputText value="Créé par:"/>
                    <h:panelGroup>
                        <h:outputText value="#{clientCreationRequests.clientCreationRequests.createdBy.name}"/>
                        <h:panelGroup rendered="#{clientCreationRequests.clientCreationRequests.createdBy != null}">
                            <h:outputText value=" ("/>
                            <h:commandLink value="Consulter" action="#{users.detailSetup}">
                                <f:param name="jsfcrud.currentClientCreationRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests][clientCreationRequests.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.currentUsers" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests.createdBy][users.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.relatedController" value="clientCreationRequests"/>
                                <f:param name="jsfcrud.relatedControllerType" value="com.mycompany.jsf.ClientCreationRequestsController"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Modifier" action="#{users.editSetup}">
                                <f:param name="jsfcrud.currentClientCreationRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests][clientCreationRequests.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.currentUsers" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests.createdBy][users.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.relatedController" value="clientCreationRequests"/>
                                <f:param name="jsfcrud.relatedControllerType" value="com.mycompany.jsf.ClientCreationRequestsController"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Supprimer" action="#{users.destroy}">
                                <f:param name="jsfcrud.currentClientCreationRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests][clientCreationRequests.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.currentUsers" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests.createdBy][users.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.relatedController" value="clientCreationRequests"/>
                                <f:param name="jsfcrud.relatedControllerType" value="com.mycompany.jsf.ClientCreationRequestsController"/>
                            </h:commandLink>
                            <h:outputText value=" )"/>
                        </h:panelGroup>
                    </h:panelGroup>
                    <h:outputText value="Traité par:"/>
                    <h:panelGroup>
                        <h:outputText value="#{clientCreationRequests.clientCreationRequests.reviewedBy.name}"/>
                        <h:panelGroup rendered="#{clientCreationRequests.clientCreationRequests.reviewedBy != null}">
                            <h:outputText value=" ("/>
                            <h:commandLink value="Consulter" action="#{users.detailSetup}">
                                <f:param name="jsfcrud.currentClientCreationRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests][clientCreationRequests.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.currentUsers" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests.reviewedBy][users.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.relatedController" value="clientCreationRequests"/>
                                <f:param name="jsfcrud.relatedControllerType" value="com.mycompany.jsf.ClientCreationRequestsController"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Modifier" action="#{users.editSetup}">
                                <f:param name="jsfcrud.currentClientCreationRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests][clientCreationRequests.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.currentUsers" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests.reviewedBy][users.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.relatedController" value="clientCreationRequests"/>
                                <f:param name="jsfcrud.relatedControllerType" value="com.mycompany.jsf.ClientCreationRequestsController"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Supprimer" action="#{users.destroy}">
                                <f:param name="jsfcrud.currentClientCreationRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests][clientCreationRequests.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.currentUsers" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests.reviewedBy][users.converter].jsfcrud_invoke}"/>
                                <f:param name="jsfcrud.relatedController" value="clientCreationRequests"/>
                                <f:param name="jsfcrud.relatedControllerType" value="com.mycompany.jsf.ClientCreationRequestsController"/>
                            </h:commandLink>
                            <h:outputText value=" )"/>
                        </h:panelGroup>
                    </h:panelGroup>


                </h:panelGrid>
                <br />
                <h:commandLink action="#{clientCreationRequests.destroy}" value="Supprimer">
                    <f:param name="jsfcrud.currentClientCreationRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests][clientCreationRequests.converter].jsfcrud_invoke}" />
                </h:commandLink>
                <br />
                <br />
                <h:commandLink action="#{clientCreationRequests.editSetup}" value="Modifier">
                    <f:param name="jsfcrud.currentClientCreationRequests" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][clientCreationRequests.clientCreationRequests][clientCreationRequests.converter].jsfcrud_invoke}" />
                </h:commandLink>
                <br />
                <h:commandLink action="#{clientCreationRequests.createSetup}" value="Créer une demande de client" />
                <br />
                <h:commandLink action="#{clientCreationRequests.listSetup}" value="Retour à la liste"/>
                <br />
                <br />
                <h:commandLink value="Tableau de bord" action="welcome" immediate="true" />

            </h:form>
    </ui:define>
</ui:composition>
