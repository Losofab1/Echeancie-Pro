<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/templates/main.xhtml">
    <ui:define name="title">Échéanciers</ui:define>
    <ui:define name="content">
<h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h1>Échéanciers</h1>
            <h:form styleClass="jsfcrud_list_form">
                <h:outputText escape="false" value="Aucun élément à afficher&lt;br /&gt;" rendered="#{paymentSchedules.pagingInfo.itemCount == 0}" />
                <h:panelGroup rendered="#{paymentSchedules.pagingInfo.itemCount > 0}">
                    <h:outputText value="Éléments #{paymentSchedules.pagingInfo.firstItem + 1} à #{paymentSchedules.pagingInfo.lastItem} sur #{paymentSchedules.pagingInfo.itemCount}"/>&#160;
                    <h:commandLink action="#{paymentSchedules.prev}" value="Précédent #{paymentSchedules.pagingInfo.batchSize}" rendered="#{paymentSchedules.pagingInfo.firstItem >= paymentSchedules.pagingInfo.batchSize}"/>&#160;
                    <h:commandLink action="#{paymentSchedules.next}" value="Suivant #{paymentSchedules.pagingInfo.batchSize}" rendered="#{paymentSchedules.pagingInfo.lastItem + paymentSchedules.pagingInfo.batchSize &lt;= paymentSchedules.pagingInfo.itemCount}"/>&#160;
                    <h:commandLink action="#{paymentSchedules.next}" value="Restant #{paymentSchedules.pagingInfo.itemCount - paymentSchedules.pagingInfo.lastItem}"
                                   rendered="#{paymentSchedules.pagingInfo.lastItem &lt; paymentSchedules.pagingInfo.itemCount &amp;&amp; paymentSchedules.pagingInfo.lastItem + paymentSchedules.pagingInfo.batchSize > paymentSchedules.pagingInfo.itemCount}"/>
                    <div class="table-responsive crud-table-wrap"><h:dataTable value="#{paymentSchedules.paymentSchedulesItems}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px" styleClass="table crud-table align-middle">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Client"/>
                            </f:facet>
                            <h:outputText value="#{item.clientId.name}" styleClass="font-weight-bold"/>
                            <h:panelGroup rendered="#{item.clientId != null}">
                                <br/><small class="text-muted"><h:outputText value="#{item.clientId.email}"/></small>
                            </h:panelGroup>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Référence"/>
                            </f:facet>
                            <h:outputText value="#{item.reference}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Montant total"/>
                            </f:facet>
                            <h:outputText value="#{item.total}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Statut"/>
                            </f:facet>
                            <h:outputText value="#{item.confirmationStatus}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Créé le"/>
                            </f:facet>
                            <h:outputText value="#{item.createdAt}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Demande"/>
                            </f:facet>
                            <h:outputText value="Montant demandé : #{item.paymentRequests.total}"/>
                            <h:panelGroup rendered="#{item.paymentRequests != null}">
                                <br/><small class="text-muted">du <h:outputText value="#{item.paymentRequests.createdAt}"><f:convertDateTime pattern="dd/MM/yyyy"/></h:outputText></small>
                            </h:panelGroup>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Gestionnaire"/>
                            </f:facet>
                            <h:outputText value="#{item.managerId.name}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText escape="false" value="&#160;"/>
                            </f:facet>
                            <h:commandLink value="Consulter" action="#{paymentSchedules.detailSetup}">
                                <f:param name="jsfcrud.currentPaymentSchedules" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][item][paymentSchedules.converter].jsfcrud_invoke}"/>
                            </h:commandLink>
                            <h:outputText value="Archivé" styleClass="badge badge-success"
                                          rendered="#{item.confirmationStatus eq 'CONFIRMED'}"/>
                            <h:outputText value=" "/>
                            <h:commandLink value="Modifier" action="#{paymentSchedules.editSetup}"
                                           rendered="#{item.confirmationStatus ne 'CONFIRMED'}">
                                <f:param name="jsfcrud.currentPaymentSchedules" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][item][paymentSchedules.converter].jsfcrud_invoke}"/>
                            </h:commandLink>
                            <h:outputText value=" " rendered="#{item.confirmationStatus ne 'CONFIRMED'}"/>
                            <h:commandLink value="Supprimer" action="#{paymentSchedules.destroy}"
                                           rendered="#{item.confirmationStatus ne 'CONFIRMED'}">
                                <f:param name="jsfcrud.currentPaymentSchedules" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][item][paymentSchedules.converter].jsfcrud_invoke}"/>
                            </h:commandLink>
                        </h:column>

                    </h:dataTable></div>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{paymentSchedules.createSetup}" value="Créer un échéancier"/>
                <br />
                <br />
                <h:commandLink value="Tableau de bord" action="welcome" immediate="true" />


            </h:form>
    </ui:define>
</ui:composition>
