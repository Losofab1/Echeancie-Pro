<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/templates/main.xhtml">
    <ui:define name="title">Historique des migrations</ui:define>
    <ui:define name="content">
<h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h1>Historique des migrations</h1>
            <h:form styleClass="jsfcrud_list_form">
                <h:outputText escape="false" value="Aucun élément à afficher&lt;br /&gt;" rendered="#{flywaySchemaHistory.pagingInfo.itemCount == 0}" />
                <h:panelGroup rendered="#{flywaySchemaHistory.pagingInfo.itemCount > 0}">
                    <h:outputText value="Éléments #{flywaySchemaHistory.pagingInfo.firstItem + 1} à #{flywaySchemaHistory.pagingInfo.lastItem} sur #{flywaySchemaHistory.pagingInfo.itemCount}"/>&#160;
                    <h:commandLink action="#{flywaySchemaHistory.prev}" value="Précédent #{flywaySchemaHistory.pagingInfo.batchSize}" rendered="#{flywaySchemaHistory.pagingInfo.firstItem >= flywaySchemaHistory.pagingInfo.batchSize}"/>&#160;
                    <h:commandLink action="#{flywaySchemaHistory.next}" value="Suivant #{flywaySchemaHistory.pagingInfo.batchSize}" rendered="#{flywaySchemaHistory.pagingInfo.lastItem + flywaySchemaHistory.pagingInfo.batchSize &lt;= flywaySchemaHistory.pagingInfo.itemCount}"/>&#160;
                    <h:commandLink action="#{flywaySchemaHistory.next}" value="Restant #{flywaySchemaHistory.pagingInfo.itemCount - flywaySchemaHistory.pagingInfo.lastItem}"
                                   rendered="#{flywaySchemaHistory.pagingInfo.lastItem &lt; flywaySchemaHistory.pagingInfo.itemCount &amp;&amp; flywaySchemaHistory.pagingInfo.lastItem + flywaySchemaHistory.pagingInfo.batchSize > flywaySchemaHistory.pagingInfo.itemCount}"/>
                    <div class="table-responsive crud-table-wrap"><h:dataTable value="#{flywaySchemaHistory.flywaySchemaHistoryItems}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px" styleClass="table crud-table align-middle">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Rang d’installation"/>
                            </f:facet>
                            <h:outputText value="#{item.installedRank}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Version"/>
                            </f:facet>
                            <h:outputText value="#{item.version}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Description"/>
                            </f:facet>
                            <h:outputText value="#{item.description}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Type"/>
                            </f:facet>
                            <h:outputText value="#{item.type}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Script"/>
                            </f:facet>
                            <h:outputText value="#{item.script}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Somme de contrôle"/>
                            </f:facet>
                            <h:outputText value="#{item.checksum}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Installé par"/>
                            </f:facet>
                            <h:outputText value="#{item.installedBy}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Installé le"/>
                            </f:facet>
                            <h:outputText value="#{item.installedOn}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Durée d’exécution"/>
                            </f:facet>
                            <h:outputText value="#{item.executionTime}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Réussite"/>
                            </f:facet>
                            <h:outputText value="#{item.success}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText escape="false" value="&#160;"/>
                            </f:facet>
                            <h:commandLink value="Consulter" action="#{flywaySchemaHistory.detailSetup}">
                                <f:param name="jsfcrud.currentFlywaySchemaHistory" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][item][flywaySchemaHistory.converter].jsfcrud_invoke}"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Modifier" action="#{flywaySchemaHistory.editSetup}">
                                <f:param name="jsfcrud.currentFlywaySchemaHistory" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][item][flywaySchemaHistory.converter].jsfcrud_invoke}"/>
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink value="Supprimer" action="#{flywaySchemaHistory.destroy}">
                                <f:param name="jsfcrud.currentFlywaySchemaHistory" value="#{jsfcrud_class['com.mycompany.jsf.util.JsfUtil'].jsfcrud_method['getAsConvertedString'][item][flywaySchemaHistory.converter].jsfcrud_invoke}"/>
                            </h:commandLink>
                        </h:column>

                    </h:dataTable></div>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{flywaySchemaHistory.createSetup}" value="Créer une migration"/>
                <br />
                <br />
                <h:commandLink value="Tableau de bord" action="welcome" immediate="true" />


            </h:form>
    </ui:define>
</ui:composition>
