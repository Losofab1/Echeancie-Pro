<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/templates/main.xhtml">
    <ui:define name="title">Créer une migration</ui:define>
    <ui:define name="content">
<h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h1>Créer une migration</h1>
            <h:form styleClass="crud-page">
                <h:inputHidden id="validateCreateField" validator="#{flywaySchemaHistory.validateCreate}" value="value"/>
                <h:panelGrid columns="2">
                    <h:outputText value="Rang d’installation:"/>
                    <h:inputText id="installedRank" value="#{flywaySchemaHistory.flywaySchemaHistory.installedRank}" title="Rang d’installation" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Version:"/>
                    <h:inputText id="version" value="#{flywaySchemaHistory.flywaySchemaHistory.version}" title="Version" />
                    <h:outputText value="Description:"/>
                    <h:inputText id="description" value="#{flywaySchemaHistory.flywaySchemaHistory.description}" title="Description" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Type:"/>
                    <h:inputText id="type" value="#{flywaySchemaHistory.flywaySchemaHistory.type}" title="Type" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Script:"/>
                    <h:inputText id="script" value="#{flywaySchemaHistory.flywaySchemaHistory.script}" title="Script" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Somme de contrôle:"/>
                    <h:inputText id="checksum" value="#{flywaySchemaHistory.flywaySchemaHistory.checksum}" title="Somme de contrôle" />
                    <h:outputText value="Installé par:"/>
                    <h:inputText id="installedBy" value="#{flywaySchemaHistory.flywaySchemaHistory.installedBy}" title="Installé par" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Installé le (jj/mm/aaaa hh:mm):"/>
                    <h:inputText id="installedOn" value="#{flywaySchemaHistory.flywaySchemaHistory.installedOn}" title="Installé le" required="true" requiredMessage="Ce champ est obligatoire." >
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:inputText>
                    <h:outputText value="Durée d’exécution:"/>
                    <h:inputText id="executionTime" value="#{flywaySchemaHistory.flywaySchemaHistory.executionTime}" title="Durée d’exécution" required="true" requiredMessage="Ce champ est obligatoire." />
                    <h:outputText value="Réussite:"/>
                    <h:inputText id="success" value="#{flywaySchemaHistory.flywaySchemaHistory.success}" title="Réussite" required="true" requiredMessage="Ce champ est obligatoire." />

                </h:panelGrid>
                <br />
                <h:commandLink action="#{flywaySchemaHistory.create}" value="Créer"/>
                <br />
                <br />
                <h:commandLink action="#{flywaySchemaHistory.listSetup}" value="Retour à la liste" immediate="true"/>
                <br />
                <br />
                <h:commandLink value="Tableau de bord" action="welcome" immediate="true" />

            </h:form>
    </ui:define>
</ui:composition>
